<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PosterBooking 電子招生看板</title>
<style>
  :root {
    --ticker-height: 50px;
    --font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: var(--font-family);
    font-weight: 700;
  }

  #app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
  }

  #posterStage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #ffffff;
  }

  #posterCanvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #ffffff;
  }

  #ticker {
    flex: 0 0 var(--ticker-height);
    height: var(--ticker-height);
    overflow: hidden;
    background: #000000;
    color: #ffffff;
    white-space: nowrap;
    position: relative;
  }

  #tickerTrack {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    height: 100%;
    width: max-content;
    will-change: transform;
    animation: marquee 28s linear infinite;
  }

  .tickerCopy {
    display: inline-flex;
    align-items: center;
    height: 100%;
    padding-right: 90px;
    font-size: clamp(24px, 2.1vw, 36px);
    line-height: 50px;
    letter-spacing: 0.5px;
  }

  @keyframes marquee {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(-50%);
    }
  }

  #toolbar {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 1000;
    width: min(520px, calc(100vw - 36px));
    padding: 16px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(0, 0, 0, 0.12);
  }

  #toolbar.hidden {
    display: none;
  }

  .toolbarRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }

  .toolbarRow:last-child {
    margin-bottom: 0;
  }

  button,
  .uploadButton {
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    background: #1f2937;
    color: #ffffff;
    font-family: var(--font-family);
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    line-height: 1.2;
  }

  button:hover,
  .uploadButton:hover {
    background: #111827;
  }

  .danger {
    background: #b91c1c;
  }

  .danger:hover {
    background: #991b1b;
  }

  #posterInput {
    display: none;
  }

  #courseInput {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: 1px solid #9ca3af;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--font-family);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.55;
    outline: none;
  }

  #courseInput:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
  }
</style>
</head>
<body>
<div id="app">
  <main id="posterStage">
    <canvas id="posterCanvas" width="1900" height="1020" aria-label="海報顯示區"></canvas>
  </main>

  <footer id="ticker" aria-label="招生課程跑馬燈">
    <div id="tickerTrack">
      <div class="tickerCopy"></div>
      <div class="tickerCopy" aria-hidden="true"></div>
    </div>
  </footer>
</div>

<section id="toolbar" class="hidden" aria-label="編輯工具列">
  <div class="toolbarRow">
    <label class="uploadButton" for="posterInput">海報上傳</label>
    <input id="posterInput" type="file" accept="image/jpeg,image/png">
    <button id="clearPosterButton" type="button">清除海報</button>
    <button id="resetButton" class="danger" type="button">全部重設</button>
    <button id="fullscreenButton" type="button">切換全螢幕</button>
  </div>
  <div class="toolbarRow">
    <textarea id="courseInput" aria-label="課程文字" placeholder="每行輸入一門課程，例如：&#10;職業安全衛生管理員【夜間：9/14】&#10;營造業甲種職業安全衛生業務主管【假日：8/29】&#10;甲種職業安全衛生業務主管【夜間：9/1】"></textarea>
  </div>
</section>

<script>
(() => {
  'use strict';

  const STORAGE_KEYS = {
    poster: 'posterbooking.poster.canvas.v1',
    courses: 'posterbooking.courses.v1'
  };

  const canvas = document.getElementById('posterCanvas');
  const context = canvas.getContext('2d', { alpha: false });
  const posterStage = document.getElementById('posterStage');
  const toolbar = document.getElementById('toolbar');
  const posterInput = document.getElementById('posterInput');
  const courseInput = document.getElementById('courseInput');
  const clearPosterButton = document.getElementById('clearPosterButton');
  const resetButton = document.getElementById('resetButton');
  const fullscreenButton = document.getElementById('fullscreenButton');
  const tickerTrack = document.getElementById('tickerTrack');
  const tickerCopies = Array.from(document.querySelectorAll('.tickerCopy'));

  const CANVAS_WIDTH = 1900;
  const CANVAS_HEIGHT = 1020;

  function clearCanvas() {
    context.save();
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    context.restore();
  }

  function savePoster() {
    try {
      const compressed = canvas.toDataURL('image/jpeg', 0.86);
      localStorage.setItem(STORAGE_KEYS.poster, compressed);
    } catch (error) {
      console.error('海報儲存失敗：', error);
    }
  }

  function drawImageToCanvas(image, shouldSave = true) {
    clearCanvas();

    const scale = Math.min(
      CANVAS_WIDTH / image.naturalWidth,
      CANVAS_HEIGHT / image.naturalHeight
    );

    const drawWidth = Math.round(image.naturalWidth * scale);
    const drawHeight = Math.round(image.naturalHeight * scale);
    const drawX = Math.round((CANVAS_WIDTH - drawWidth) / 2);
    const drawY = Math.round((CANVAS_HEIGHT - drawHeight) / 2);

    context.drawImage(image, drawX, drawY, drawWidth, drawHeight);

    if (shouldSave) {
      savePoster();
    }
  }

  function loadStoredPoster() {
    const savedPoster = localStorage.getItem(STORAGE_KEYS.poster);
    clearCanvas();

    if (!savedPoster) {
      return;
    }

    const image = new Image();
    image.onload = () => drawImageToCanvas(image, false);
    image.onerror = clearCanvas;
    image.src = savedPoster;
  }

  function normalizeCourseLine(line) {
    const trimmed = line.trim();
    if (!trimmed) {
      return null;
    }

    const match = trimmed.match(/^(.*?)【\s*([^：:】]+)\s*[：:]\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*】\s*$/);

    if (!match) {
      return {
        original: trimmed,
        sortable: false,
        month: 99,
        day: 99,
        output: trimmed
      };
    }

    const name = match[1].trim();
    const type = match[2].trim();
    const month = Number(match[3]);
    const day = Number(match[4]);

    return {
      original: trimmed,
      sortable: true,
      month,
      day,
      output: `${month}/${day}【${type}】${name}`
    };
  }

  function buildTickerText(rawText) {
    const courses = rawText
      .split(/\r?\n/)
      .map(normalizeCourseLine)
      .filter(Boolean)
      .sort((a, b) => {
        if (a.sortable && b.sortable) {
          return a.month - b.month || a.day - b.day || a.output.localeCompare(b.output, 'zh-Hant');
        }
        if (a.sortable) return -1;
        if (b.sortable) return 1;
        return a.output.localeCompare(b.output, 'zh-Hant');
      });

    if (courses.length === 0) {
      return '📢 最新招生｜歡迎報名！';
    }

    return `📢 最新招生｜${courses.map(course => course.output).join('｜')}｜歡迎報名！`;
  }

  function refreshTicker() {
    const tickerText = buildTickerText(courseInput.value);
    tickerCopies.forEach(copy => {
      copy.textContent = tickerText;
    });

    requestAnimationFrame(() => {
      const singleWidth = tickerCopies[0].scrollWidth;
      const viewportWidth = document.documentElement.clientWidth;
      const distance = Math.max(singleWidth, viewportWidth);
      const pixelsPerSecond = 95;
      const duration = Math.max(12, distance / pixelsPerSecond);
      tickerTrack.style.animationDuration = `${duration}s`;
    });
  }

  function saveCourses() {
    localStorage.setItem(STORAGE_KEYS.courses, courseInput.value);
    refreshTicker();
  }

  function loadStoredCourses() {
    const savedCourses = localStorage.getItem(STORAGE_KEYS.courses);
    courseInput.value = savedCourses || '';
    refreshTicker();
  }

  posterInput.addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (!file) {
      return;
    }

    if (!['image/jpeg', 'image/png'].includes(file.type)) {
      posterInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const image = new Image();
      image.onload = () => {
        drawImageToCanvas(image, true);
        posterInput.value = '';
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  courseInput.addEventListener('input', saveCourses);

  clearPosterButton.addEventListener('click', () => {
    clearCanvas();
    localStorage.removeItem(STORAGE_KEYS.poster);
    posterInput.value = '';
  });

  resetButton.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEYS.poster);
    localStorage.removeItem(STORAGE_KEYS.courses);
    clearCanvas();
    courseInput.value = '';
    posterInput.value = '';
    refreshTicker();
  });

  fullscreenButton.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.error('無法切換全螢幕：', error);
    }
  });

  document.addEventListener('keydown', event => {
    if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'e') {
      event.preventDefault();
      toolbar.classList.toggle('hidden');
    }
  });

  window.addEventListener('resize', refreshTicker);

  document.addEventListener('fullscreenchange', refreshTicker);

  clearCanvas();
  loadStoredPoster();
  loadStoredCourses();
})();
</script>
</body>
</html>
